name: cat_logic
description: Cat Logic, a calm star-battle puzzle by Tinybit Labs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/levels/levels.json
    - assets/levels/daily.json
    - config/application_id.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
