name: cat_logic
description: Cat Logic, a calm star-battle puzzle by Tinybit Labs.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  firebase_analytics: ^13.1.0
  firebase_core: ^5.2.0
  firebase_crashlytics: ^6.1.0
  firebase_remote_config: ^7.1.0
  flutter:
    sdk: flutter
  games_services: ^5.3.0
  google_mobile_ads: ^9.2.0
  in_app_purchase: ^3.3.1
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: false
  assets:
    - assets/levels/campaign.bin.gz
    - assets/levels/daily.bin.gz
    - config/application_id.txt
    - config/play_games_app_id.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
